<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台灣飛彈打中國</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Noto+Sans+TC:wght@500;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: none; /* 防止手機雙擊縮放 */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* 背景調整為類似海峽/高空的藍灰色調 */
            background: linear-gradient(to bottom, #0f172a, #1e3a8a, #60a5fa); 
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .title {
            font-family: 'Noto Sans TC', sans-serif; /* 改回黑體以支援中文 */
            font-weight: 900;
            font-size: 3.5rem;
            color: #ef4444; /* 紅色標題 */
            letter-spacing: 2px;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
            line-height: 1.2;
        }

        .score-display {
            position: absolute;
            top: 10%;
            font-family: 'Black Ops One', cursive;
            font-size: 5rem;
            color: rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        .btn {
            pointer-events: auto;
            background: linear-gradient(45deg, #b91c1c, #991b1b);
            border: 2px solid #fca5a5;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            color: white;
        }

        .btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px #ef4444; }
            50% { transform: scale(1.05); text-shadow: 0 0 20px #ef4444, 0 0 30px #f87171; }
            100% { transform: scale(1); text-shadow: 0 0 10px #ef4444; }
        }

        /* 爆炸特效 */
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="flash-overlay" class="flash"></div>

    <div id="score" class="score-display">0</div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="ui-layer">
        <div class="title">中國飛彈<br>打台灣</div>
        <p class="text-xl mb-8 font-bold text-gray-200">穿越中央山脈防線</p>
        <p class="text-md mb-8 text-gray-400">點擊畫面 或 按空白鍵 發射</p>
        <button class="btn" onclick="startGame()">發射飛彈</button>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="game-over-screen" class="ui-layer hidden" style="display: none;">
        <div class="title" style="color: #fbbf24;">任務失敗</div>
        <div class="bg-black/50 p-6 rounded-xl backdrop-blur-sm mb-6 border border-white/20">
            <p class="text-xl text-gray-300">飛行距離</p>
            <p id="final-score" class="text-5xl font-bold mb-4">0</p>
            <p class="text-sm text-gray-400">最佳紀錄: <span id="best-score">0</span></p>
        </div>
        <button class="btn" onclick="resetGame()">重新發射</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const flashOverlay = document.getElementById('flash-overlay');

    // 遊戲參數
    let frames = 0;
    let score = 0;
    let bestScore = localStorage.getItem('china_missile_best') || 0;
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let gameSpeed = 3;
    const gravity = 0.25;

    // 調整畫布大小
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 音效 (使用 Web Audio API 生成簡單音效)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'jump') {
            // 噴射聲 (更尖銳一點，像火箭)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'crash') {
            // 撞山爆炸聲
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'score') {
            // 通過聲
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    // 粒子系統 (尾焰)
    const particles = [];
    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 7 + 3;
            this.speedX = Math.random() * -2 - 1;
            this.speedY = (Math.random() - 0.5) * 2;
            this.color = `hsl(${Math.random() * 40 + 10}, 100%, 50%)`; // 火焰色
            this.life = 1.0; 
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 0.04;
            this.size *= 0.95;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.life;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function handleParticles() {
        if (gameState === 'PLAYING' && frames % 2 === 0) {
            const angle = missile.rotation;
            const offsetX = Math.cos(angle) * -20;
            const offsetY = Math.sin(angle) * -20;
            particles.push(new Particle(missile.x + offsetX, missile.y + offsetY));
        }
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
                i--;
            }
        }
    }

    // 飛彈物件
    const missile = {
        x: 50,
        y: 150,
        width: 40,
        height: 20,
        radius: 12, 
        velocity: 0,
        jumpStrength: 4.6,
        rotation: 0,
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            // 彈體 (軍綠色/灰色)
            ctx.fillStyle = '#4b5563'; 
            ctx.beginPath();
            ctx.ellipse(0, 0, 25, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // 紅色彈頭 (標誌性)
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.moveTo(15, -8);
            ctx.lineTo(35, 0); 
            ctx.lineTo(15, 8);
            ctx.fill();

            // 尾翼
            ctx.fillStyle = '#1f2937';
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.lineTo(-28, -16);
            ctx.lineTo(-5, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-15, 0);
            ctx.lineTo(-28, 16);
            ctx.lineTo(-5, 0);
            ctx.fill();

            // 五星裝飾 (象徵)
            ctx.fillStyle = '#fbbf24'; // 黃色
            ctx.font = '10px Arial';
            ctx.fillText('★', -5, 4);

            ctx.restore();
        },
        
        update: function() {
            this.velocity += gravity;
            this.y += this.velocity;

            if (this.y + this.radius >= canvas.height || this.y - this.radius <= 0) {
                gameOver();
            }

            if (this.velocity < 0) {
                this.rotation = -0.4; 
            } else {
                this.rotation += 0.03; 
                if (this.rotation > 1.2) this.rotation = 1.2; 
            }
        },
        
        jump: function() {
            this.velocity = -this.jumpStrength;
            this.rotation = -0.4;
            playSound('jump');
            for(let i=0; i<5; i++) {
                const angle = this.rotation;
                const offsetX = Math.cos(angle) * -20;
                const offsetY = Math.sin(angle) * -20;
                particles.push(new Particle(this.x + offsetX, this.y + offsetY));
            }
        }
    };

    // 障礙物 (山脈)
    const obstacles = {
        list: [],
        width: 80, // 山脈比較寬
        gap: 180,  // 稍微寬一點的縫隙，因為山脈形狀不規則
        dx: 3,     

        draw: function() {
            for (let i = 0; i < this.list.length; i++) {
                let obs = this.list[i];
                
                // 繪製上方山脈 (倒懸)
                this.drawMountain(obs.x, 0, this.width, obs.top, true);

                // 繪製下方山脈
                this.drawMountain(obs.x, canvas.height, this.width, obs.bottom, false);
            }
        },

        // 繪製單座山脈的函數
        drawMountain: function(x, startY, w, h, isInverted) {
            ctx.fillStyle = '#374151'; // 深灰岩石色
            ctx.strokeStyle = '#1f2937'; // 更深的邊框
            
            ctx.beginPath();
            if (isInverted) {
                // 上方倒懸山脈 (Stalactite)
                // 畫一個不規則的倒三角形
                ctx.moveTo(x, 0); // 左上角
                ctx.lineTo(x + w, 0); // 右上角
                // 隨機變化的尖端，讓它看起來像岩石
                ctx.lineTo(x + w * 0.8, h * 0.8); 
                ctx.lineTo(x + w * 0.5, h); // 尖端
                ctx.lineTo(x + w * 0.2, h * 0.9);
                ctx.lineTo(x, 0);
            } else {
                // 下方山脈
                ctx.moveTo(x, startY); // 左下角
                ctx.lineTo(x + w, startY); // 右下角
                // 隨機變化的尖端
                ctx.lineTo(x + w * 0.9, startY - h * 0.8);
                ctx.lineTo(x + w * 0.5, startY - h); // 尖端
                ctx.lineTo(x + w * 0.1, startY - h * 0.7);
                ctx.lineTo(x, startY);
            }
            ctx.fill();
            
            // 加上一些紋理/細節 (隨機線條)
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 畫一點植被 (綠色)
            ctx.fillStyle = '#166534'; // 深綠色
            ctx.beginPath();
            if(!isInverted) {
                // 只在下方山脈畫植被
                ctx.moveTo(x + w * 0.3, startY - h * 0.5);
                ctx.lineTo(x + w * 0.7, startY - h * 0.4);
                ctx.lineTo(x + w * 0.5, startY - h * 0.2);
                ctx.fill();
            }
        },

        update: function() {
            if (frames % 110 === 0) {
                let minHeight = 50;
                let maxHeight = canvas.height - this.gap - minHeight;
                let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                let bottomHeight = canvas.height - this.gap - topHeight;

                this.list.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: bottomHeight,
                    passed: false
                });
            }

            for (let i = 0; i < this.list.length; i++) {
                let obs = this.list[i];
                obs.x -= this.dx;

                // 碰撞檢測 (簡化為矩形判定，雖然是山脈形狀，但判定框保持矩形以增加難度與公平性)
                // 也可以視為氣流擾動區
                if (missile.x + missile.radius > obs.x && 
                    missile.x - missile.radius < obs.x + this.width) {
                    
                    // 檢查 Y 軸碰撞
                    // 上方山脈碰撞
                    if (missile.y - missile.radius < obs.top) {
                        gameOver();
                    }
                    // 下方山脈碰撞
                    if (missile.y + missile.radius > canvas.height - obs.bottom) {
                        gameOver();
                    }
                }

                if (obs.x + this.width < missile.x && !obs.passed) {
                    score++;
                    obs.passed = true;
                    scoreEl.innerText = score;
                    playSound('score');
                    if(score % 5 === 0) this.dx += 0.2;
                }

                if (obs.x + this.width < 0) {
                    this.list.shift();
                    i--;
                }
            }
        }
    };

    // 背景雲層
    const background = {
        clouds: [],
        init: function() {
            for(let i=0; i<8; i++) {
                this.clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.6,
                    w: Math.random() * 100 + 50,
                    speed: Math.random() * 0.5 + 0.2
                });
            }
        },
        update: function() {
            this.clouds.forEach(c => {
                c.x -= c.speed;
                if(c.x + c.w < 0) c.x = canvas.width + c.w;
            });
        },
        draw: function() {
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            this.clouds.forEach(c => {
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.w, c.w*0.4, 0, 0, Math.PI*2);
                ctx.fill();
            });
        }
    }
    background.init();

    // 遊戲循環
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        background.update();
        background.draw();

        if (gameState === 'PLAYING') {
            obstacles.update();
            obstacles.draw();
            missile.update();
            missile.draw();
            handleParticles();
            frames++;
            requestAnimationFrame(loop);
        } else if (gameState === 'GAMEOVER') {
            obstacles.draw();
            missile.draw();
            handleParticles();
        } else if (gameState === 'START') {
            missile.y = 150 + Math.sin(Date.now()/300) * 5;
            missile.draw();
            handleParticles();
            requestAnimationFrame(loop);
        }
    }

    function inputAction(e) {
        if (e.type === 'keydown' && e.code === 'Space') {
            e.preventDefault();
        }
        if (gameState === 'START') {
        } else if (gameState === 'PLAYING') {
            missile.jump();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') inputAction(e);
    });
    window.addEventListener('mousedown', inputAction);
    window.addEventListener('touchstart', (e) => {
        inputAction(e);
    }, {passive: false});

    window.startGame = function() {
        startScreen.style.display = 'none';
        scoreEl.style.display = 'block';
        resetVariables();
        gameState = 'PLAYING';
        missile.jump();
        loop();
    }

    window.resetGame = function() {
        gameOverScreen.style.display = 'none';
        scoreEl.style.display = 'block';
        resetVariables();
        gameState = 'PLAYING';
        missile.jump();
        loop();
    }

    function resetVariables() {
        missile.x = canvas.width / 4;
        missile.y = canvas.height / 2;
        missile.velocity = 0;
        missile.rotation = 0;
        obstacles.list = [];
        obstacles.dx = 3;
        particles.length = 0;
        score = 0;
        frames = 0;
        scoreEl.innerText = score;
        bestScoreEl.innerText = bestScore;
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        playSound('crash');
        flashOverlay.style.opacity = '0.8';
        setTimeout(() => flashOverlay.style.opacity = '0', 100);
        for(let i=0; i<30; i++) {
            particles.push(new Particle(missile.x, missile.y));
        }
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('china_missile_best', bestScore);
        }
        finalScoreEl.innerText = score;
        bestScoreEl.innerText = bestScore;
        setTimeout(() => {
            scoreEl.style.display = 'none';
            gameOverScreen.style.display = 'flex';
        }, 500);
    }

    resetVariables();
    gameState = 'START';
    loop();

</script>
</body>
</html>
